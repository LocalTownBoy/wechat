<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  <title>推送消息列表</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Droid Sans", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Droid Sans Fallback", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
    }
    .page {
      max-width: 960px;
      margin: 32px auto;
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px -16px rgba(7, 97, 96, 0.25);
    }
    .payload {
      white-space: pre-wrap;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      background: #0b1628;
      color: #e5f0ff;
      padding: 12px;
      border-radius: 8px;
      margin: 0;
    }
    .table > :not(caption) > * > * {
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h3 class="mb-1">推送消息列表</h3>
        <small class="text-muted">数据来源：{{ excel_path }}</small>
      </div>
      <a class="btn btn-outline-secondary btn-sm" href="/">返回首页</a>
    </div>

    {% if error %}
    <div class="alert alert-warning" role="alert">
      {{ error }}
    </div>
    {% endif %}

    {% if messages %}
    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th scope="col" style="width: 180px;">接收时间</th>
            <th scope="col">消息内容</th>
          </tr>
        </thead>
        <tbody>
          {% for item in messages %}
          <tr>
            <td>{{ item.received_at }}</td>
            <td><pre class="payload">{{ item.payload }}</pre></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <div class="text-center text-muted py-5">
      暂无记录，请先调用 /push/msg 写入数据。
    </div>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
</body>
</html>
